name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Version figée servie en parallèle de la version courante, sous /v1/.
  FROZEN_TAG: v1.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # les tags sont nécessaires pour construire la version figée

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Version courante (main) → racine du site ────────────────────────────
      - run: npm ci
      # Les tests bloquent le déploiement : un cœur de calcul cassé ne part pas
      # en ligne, et la version figée sous /v1/ reste servie telle quelle.
      - run: npm test
      - run: npm run build

      # ── Version figée (tag) → sous-dossier /v1/ ─────────────────────────────
      - name: Build ${{ env.FROZEN_TAG }}
        run: |
          git worktree add ../frozen "$FROZEN_TAG"
          cd ../frozen
          npm ci
          npx vite build --base=/catalogue-builder/v1/

      - name: Copier la version figée dans dist/v1
        run: cp -r ../frozen/dist dist/v1

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
